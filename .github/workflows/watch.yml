name: watch

on:
  schedule:
    - cron: "*/30 * * * *"  # check every 30 minutes
    - cron: "0 6 * * 1"    # weekly full re-fetch (catches silent edits)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for changes
        run: python tracker.py run ${{ github.event.schedule == '0 6 * * 1' && '--full' || '' }}

      - name: Build dashboard
        run: python build_site.py

      - name: Commit updated state
        run: |
          git config user.name "topstep-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker.db docs CHANGELOG.md
          git diff --cached --quiet || git commit -m "watch: update snapshots and dashboard"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
